<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netopology API</title>
  </head>
  <body>
    <!-- Scalar API reference for the contract (backend/api/contract.yaml).
         Serve the REPOSITORY ROOT over HTTP (opening the file directly cannot load the YAML):
           python -m http.server 8088      then open http://localhost:8088/docs/api/
         The running backend also serves its generated spec at /api/v1/docs (development only). -->
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '../../backend/api/contract.yaml',
        theme: 'default',
        darkMode: true,
        hideClientButton: false,
      })
    </script>
  </body>
</html>
