<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netopology API</title>
  </head>
  <body>
    <!-- Scalar API reference for openapi.yaml.
         Serve this folder over HTTP (opening the file directly cannot load the YAML):
           python -m http.server 8080 -d docs/api      then open http://localhost:8080 -->
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.yaml',
        theme: 'default',
        darkMode: true,
        hideClientButton: false,
      })
    </script>
  </body>
</html>
