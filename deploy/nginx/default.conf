# Netopology gateway: one public port. /api -> api (Go), everything else -> web (Next.js).
# TLS: terminate here (add a 443 server with your certificates) or in front of it (your own proxy,
# Cloudflare Tunnel, ...). If you skip this gateway, route the same two prefixes yourself.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  # API: REST + server-sent events. No buffering, long reads, so live updates stream immediately.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Health probes stay internal.
  location = /healthz { return 404; }
  location = /readyz  { return 404; }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
